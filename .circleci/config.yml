# Python CircleCI configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2.1

parameters:
  deploy_stage:
    type: boolean
    default: false

jobs:
  install_deps:
    docker:
      - image: cimg/python:3.12
        environment:
          APP_SETTINGS: settings.test

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v3-dependencies-{{ checksum "frozen_requirements.txt" }}
          # fallback to using the latest cache if no exact match is found
          - v3-dependencies-

      - run:
          name: install dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r frozen_requirements.txt

      - save_cache:
          paths:
            - ./venv
          key: v3-dependencies-{{ checksum "frozen_requirements.txt" }}

  test:
    docker:
      - image: cimg/python:3.12
        environment:
          APP_SETTINGS: settings.test

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: mudgeconzTest
          POSTGRES_DB: mudgeconzTest
          POSTGRES_PASSWORD: testing

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v3-dependencies-{{ checksum "frozen_requirements.txt" }}
          # fallback to using the latest cache if no exact match is found
          - v3-dependencies-

      - run:
          name: add commithash version
          command:
            touch .commithash
      - run:
          name: run tests
          command: |
            . venv/bin/activate
            pytest tests

  lint:
    docker:
      - image: cimg/node:24.18

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
          - v1-npm-dependencies-{{ checksum "package-lock.json" }}
          - v1-npm-dependencies-

      - run:
          name: install npm dependencies
          command: npm ci

      - save_cache:
          paths:
            - node_modules
          key: v1-npm-dependencies-{{ checksum "package-lock.json" }}

      - run:
          name: run eslint
          command: npm run lint

  build_and_push:
    docker:
      - image: cimg/base:2021.04

    working_directory: ~/repo

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Docker login to DO registry
          command: |
            echo "$DOCR_TOKEN" | docker login registry.digitalocean.com -u "$DOCR_TOKEN" --password-stdin
      - run:
          name: Build and push image
          command: |
            docker build \
              --build-arg GIT_SHA=$CIRCLE_SHA1 \
              -t registry.digitalocean.com/mikemudge/mudgeconz-app:$CIRCLE_SHA1 \
              -t registry.digitalocean.com/mikemudge/mudgeconz-app:latest \
              .

            # Garbage collection (triggered below, after every push) makes the
            # whole registry read-only for pushes while it runs - retry with
            # backoff in case a previous build's GC is still finishing up.
            push_with_retry() {
              for i in $(seq 1 20); do
                docker push "$1" && return 0
                echo "Push failed (attempt $i/20) - registry may be read-only from garbage collection, retrying in 30s..."
                sleep 30
              done
              return 1
            }
            push_with_retry registry.digitalocean.com/mikemudge/mudgeconz-app:$CIRCLE_SHA1
            push_with_retry registry.digitalocean.com/mikemudge/mudgeconz-app:latest

      - run:
          name: Prune old image tags (keep newest 2) and garbage collect
          command: |
            # Best-effort cleanup - a failure here must never fail the deploy.
            set +e
            KEEP=2
            REPO=mudgeconz-app

            DOCTL_VERSION=$(curl -s https://api.github.com/repos/digitalocean/doctl/releases/latest | jq -r .tag_name | sed 's/^v//')
            curl -sL "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" | tar xz
            sudo mv doctl /usr/local/bin/
            doctl auth init -t "$DOCR_TOKEN"

            OLD_TAGS=$(doctl registry repository list-tags "$REPO" --output json \
              | jq -r --argjson keep "$KEEP" '
                  map(select(.tag != "latest"))
                  | sort_by(.updated_at) | reverse
                  | .[$keep:]
                  | .[].tag
                ')

            if [ -n "$OLD_TAGS" ]; then
              echo "$OLD_TAGS" | xargs -r -I{} doctl registry repository delete-tag "$REPO" {} --force
            else
              echo "Nothing to prune."
            fi

            if doctl registry garbage-collection get-active --output json | jq -e 'length == 0' > /dev/null; then
              doctl registry garbage-collection start --include-untagged-manifests --force
            else
              echo "Garbage collection already running, skipping."
            fi
            exit 0

  deploy:
    docker:
      - image: cimg/base:2021.04
        environment:
          APP_SETTINGS: settings.test

    working_directory: ~/repo

    steps:
      - checkout

      - add_ssh_keys
      - run:
          name: Keyscan Github (HACK)
          command: ssh-keyscan -H mudge.co.nz >> ~/.ssh/known_hosts
      - run:
          name: deploy via ssh, git pull and deploy.sh
          command:
            ssh mudge@mudge.co.nz "cd projects/pyauto && flock /tmp/pyauto-git.lock -c 'git pull' && ./deploy.sh $CIRCLE_SHA1"

  deploy_staging:
    docker:
      - image: cimg/base:2021.04
        environment:
          APP_SETTINGS: settings.test

    working_directory: ~/repo

    steps:
      - checkout

      - add_ssh_keys
      - run:
          name: Keyscan Github (HACK)
          command: ssh-keyscan -H mudge.co.nz >> ~/.ssh/known_hosts
      - run:
          name: deploy via ssh, git pull and deploy-staging.sh
          command:
            ssh mudge@mudge.co.nz "cd projects/pyauto && flock /tmp/pyauto-git.lock -c 'git pull' && ./deploy-staging.sh $CIRCLE_SHA1"

workflows:
  build_and_deploy:
    when:
      not: << pipeline.parameters.deploy_stage >>
    jobs:
      - install_deps
      - test:
          requires:
            - install_deps
      - lint
      - build_and_push:
          context: Build
          requires:
            - test
            - lint
          filters:
            branches:
              only:
                - main
      - deploy_staging:
          requires:
            - build_and_push
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - deploy_staging
          filters:
            branches:
              only:
                - main

  # Triggered manually (CircleCI web UI "Trigger Pipeline", or the API) with
  # the deploy_stage parameter set true, on whatever branch you pick - lets
  # any branch deploy to staging without needing it on main or staging first.
  deploy_stage_manual:
    when:
      << pipeline.parameters.deploy_stage >>
    jobs:
      - install_deps
      - test:
          requires:
            - install_deps
      - lint
      - build_and_push:
          context: Build
          requires:
            - test
            - lint
      - deploy_staging:
          requires:
            - build_and_push
