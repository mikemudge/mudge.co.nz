services:
  db:
    image: mdillon/postgis:9.5
#    ports:
#      - "15432:5432"
    volumes:
      - ./.local_postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
  app:
    container_name: app
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - .:/app
    depends_on:
      - db
    ports:
      - 5000:5000
      # For local https testing.
      - 5001:5001
    environment:
      # PG* is used as defaults for psql
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=postgres
      # default to use the dev enviroment.
      - APP_SETTINGS=settings.dev
      - APP_TEST_SETTINGS=settings.localtest
      - ENV=dev
      - PYTHONIOENCODING=utf-8
      # Because its nice to get logs immediately when you are debugging.
      - PYTHONUNBUFFERED=true
      - LC_ALL=C.UTF-8
      - LANG=C.UTF-8
      - FLASK_APP=manage.py
      - FLASK_DEBUG=1
    command: ["/app/docker/run_dev.sh"]
#    local https mode.
#    command: ["/app/run_https.py"]
    # command: sleep infinity

  # Runs the app the way production does (uwsgi, worker scaling) instead
  # of the Flask dev server, for testing prod-like behaviour while
  # iterating. `docker compose up app-uwsgi` - localhost:5002.
  app-uwsgi:
    container_name: app-uwsgi
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - .:/app
    depends_on:
      - db
    ports:
      - 5002:5002
    environment:
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - APP_SETTINGS=settings.dev
      - ENV=dev
      - PYTHONIOENCODING=utf-8
      - PYTHONUNBUFFERED=true
      - LC_ALL=C.UTF-8
      - LANG=C.UTF-8
    command: ["/app/docker/run_prod_like.sh"]
