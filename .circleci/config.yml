# Python CircleCI configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2.1

parameters:
  deploy_stage:
    type: boolean
    default: false
  run_gc:
    type: boolean
    default: false

commands:
  docker_login:
    steps:
      - run:
          name: Docker login to GHCR
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mikemudge --password-stdin

  push_with_retry:
    parameters:
      image:
        type: string
    steps:
      - run:
          name: "Push << parameters.image >>"
          command: |
            # Generic resilience against a transient registry hiccup - not
            # tied to a specific known failure mode the way this used to be
            # for DOCR's GC-causes-brief-read-only behavior. GHCR's own
            # cleanup (prune_ghcr_untagged below) is push-independent - it
            # only ever deletes already-untagged versions via the API, it
            # doesn't touch the registry's ability to accept a push - so
            # there's no GHCR equivalent of that DOCR failure mode to retry
            # around here.
            for i in $(seq 1 5); do
              docker push "<< parameters.image >>" && exit 0
              echo "Push failed (attempt $i/5), retrying in 15s..."
              sleep 15
            done
            exit 1

jobs:
  install_deps:
    docker:
      - image: cimg/python:3.12
        environment:
          APP_SETTINGS: settings.test

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v4-dependencies-{{ checksum "frozen_requirements.txt" }}
          # fallback to using the latest cache if no exact match is found
          - v4-dependencies-

      - run:
          name: install dependencies
          command: |
            # --upgrade repairs a restored cache's venv in place (e.g. its
            # bin/python3 symlink pointing at a python patch version that
            # no longer exists after cimg/python:3.12 gets updated) rather
            # than erroring out. It's only for repairing an *existing*
            # venv though - on a cache miss (nothing restored) it sets up
            # python/pip but skips bin/activate, so a plain create is
            # still needed for that case.
            if [ -d venv ]; then
              python3 -m venv --upgrade venv
            else
              python3 -m venv venv
            fi
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r frozen_requirements.txt

      - save_cache:
          paths:
            - ./venv
          key: v4-dependencies-{{ checksum "frozen_requirements.txt" }}

  test:
    docker:
      - image: cimg/python:3.12
        environment:
          APP_SETTINGS: settings.test

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: mudgeconzTest
          POSTGRES_DB: mudgeconzTest
          POSTGRES_PASSWORD: testing

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v4-dependencies-{{ checksum "frozen_requirements.txt" }}
          # fallback to using the latest cache if no exact match is found
          - v4-dependencies-

      - run:
          name: add commithash version
          command:
            touch .commithash
      - run:
          name: run tests
          command: |
            . venv/bin/activate
            pytest tests

  lint:
    docker:
      - image: cimg/node:24.18

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
          - v1-npm-dependencies-{{ checksum "package-lock.json" }}
          - v1-npm-dependencies-

      - run:
          name: install npm dependencies
          command: npm ci

      - save_cache:
          paths:
            - node_modules
          key: v1-npm-dependencies-{{ checksum "package-lock.json" }}

      - run:
          name: run eslint
          command: npm run lint

  build_and_push:
    docker:
      - image: cimg/base:2021.04

    working_directory: ~/repo

    steps:
      - checkout

      - setup_remote_docker
      - docker_login

      - run:
          name: Skip build if only static/docs changed since the last image
          command: |
            git fetch --unshallow origin 2>/dev/null || true

            docker pull ghcr.io/mikemudge/mudgeconz-app:staging 2>/dev/null || true
            LAST_SHA=$(docker run --rm ghcr.io/mikemudge/mudgeconz-app:staging cat /app/.commithash 2>/dev/null || echo "")

            if [ -z "$LAST_SHA" ] || ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
              echo "No usable previous build found - building."
            elif git diff --name-only "$LAST_SHA" HEAD -- . ':!static' ':!nginx' ':!README.md' | grep -q .; then
              echo "Backend changes found since $LAST_SHA - building."
            else
              echo "Only static/nginx/README changed since $LAST_SHA - skipping image build."
              circleci-agent step halt
            fi
      - run:
          name: Build image
          command: |
            docker build \
              --build-arg GIT_SHA=$CIRCLE_SHA1 \
              -t ghcr.io/mikemudge/mudgeconz-app:staging \
              .
      - push_with_retry:
          image: ghcr.io/mikemudge/mudgeconz-app:staging

  deploy:
    docker:
      - image: cimg/base:2021.04
        environment:
          APP_SETTINGS: settings.test

    working_directory: ~/repo

    steps:
      - checkout

      - setup_remote_docker
      - docker_login

      - run:
          name: Promote staging to prod, unless prod already matches it
          command: |
            IMAGE=ghcr.io/mikemudge/mudgeconz-app

            push_with_retry() {
              for i in $(seq 1 5); do
                docker push "$1" && return 0
                echo "Push failed (attempt $i/5), retrying in 15s..."
                sleep 15
              done
              return 1
            }

            docker pull "$IMAGE:staging"
            STAGING_SHA=$(docker run --rm "$IMAGE:staging" cat /app/.commithash)

            PROD_SHA=""
            if docker pull "$IMAGE:prod"; then
              PROD_SHA=$(docker run --rm "$IMAGE:prod" cat /app/.commithash 2>/dev/null || echo "")
            fi

            if [ -n "$PROD_SHA" ] && [ "$STAGING_SHA" = "$PROD_SHA" ]; then
              echo "prod already matches staging ($STAGING_SHA) - nothing to promote. (deploy.sh below still runs, to pick up any static/nginx-only changes.)"
              exit 0
            fi

            if [ -n "$PROD_SHA" ]; then
              docker tag "$IMAGE:prod" "$IMAGE:prev_prod"
              push_with_retry "$IMAGE:prev_prod" || exit 1
            else
              echo "No existing prod tag yet (first deploy?) - nothing to preserve as prev_prod."
            fi

            docker tag "$IMAGE:staging" "$IMAGE:prod"
            push_with_retry "$IMAGE:prod" || exit 1

      - add_ssh_keys
      - run:
          name: Keyscan Github (HACK)
          command: ssh-keyscan -H mudge.co.nz >> ~/.ssh/known_hosts
      - run:
          name: deploy via ssh, git pull and deploy.sh
          command:
            ssh mudge@mudge.co.nz "cd projects/pyauto && flock /tmp/pyauto-git.lock -c 'git pull' && ./deploy.sh"

  deploy_staging:
    docker:
      - image: cimg/base:2021.04
        environment:
          APP_SETTINGS: settings.test

    working_directory: ~/repo

    steps:
      - checkout

      - add_ssh_keys
      - run:
          name: Keyscan Github (HACK)
          command: ssh-keyscan -H mudge.co.nz >> ~/.ssh/known_hosts
      - run:
          name: deploy via ssh, checkout branch and deploy-staging.sh
          command:
            ssh mudge@mudge.co.nz "cd projects/stage-mudge && flock /tmp/stage-mudge-git.lock -c 'git fetch origin $CIRCLE_BRANCH && git checkout -B $CIRCLE_BRANCH origin/$CIRCLE_BRANCH' && ./deploy-staging.sh"

  # GHCR has no built-in garbage collection (unlike DOCR, which had a
  # doctl-triggerable GC job) - an untagged image version (the manifest a
  # mutable tag like staging/prod/prev_prod used to point at, before the
  # next retag replaced it) just sits there taking up storage forever unless
  # something explicitly deletes it via the API. Every version this job sees
  # with an empty `tags` list is genuinely orphaned - our tag set is fixed
  # (staging/prod/prev_prod), never per-commit, so there's no "keep the last
  # N untagged" case to worry about losing. Needs GHCR_TOKEN's PAT to also
  # carry the delete:packages scope (read/write:packages alone, as used for
  # docker_login, isn't enough to call the delete endpoint below).
  prune_ghcr_untagged:
    docker:
      - image: cimg/base:2021.04

    working_directory: ~/repo

    steps:
      - run:
          name: Delete untagged mudgeconz-app versions from GHCR
          command: |
            PACKAGE=mudgeconz-app
            API="https://api.github.com/user/packages/container/$PACKAGE/versions"
            AUTH_HEADER="Authorization: Bearer $GHCR_TOKEN"

            page=1
            while :; do
              resp=$(curl -s -H "$AUTH_HEADER" -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" "$API?per_page=100&page=$page")
              count=$(echo "$resp" | jq 'length')
              [ "$count" -eq 0 ] && break

              echo "$resp" | jq -c '.[] | select(.metadata.container.tags | length == 0)' \
                | while read -r version; do
                    id=$(echo "$version" | jq -r '.id')
                    created=$(echo "$version" | jq -r '.created_at')
                    # Skip anything from the last 6 hours in case a push/retag
                    # for this exact version is still in flight elsewhere.
                    age=$(( $(date +%s) - $(date -d "$created" +%s) ))
                    if [ "$age" -lt 21600 ]; then
                      echo "Skipping version $id (created $created, too recent)"
                      continue
                    fi
                    echo "Deleting untagged version $id (created $created)"
                    curl -s -X DELETE -H "$AUTH_HEADER" -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" "$API/$id"
                  done

              page=$((page + 1))
            done

            echo "Done."

workflows:
  build_and_deploy:
    when:
      and:
        - not: << pipeline.parameters.deploy_stage >>
        - not: << pipeline.parameters.run_gc >>
    jobs:
      - install_deps
      - test:
          requires:
            - install_deps
      - lint
      - build_and_push:
          context: Build
          requires:
            - test
            - lint
          filters:
            branches:
              only:
                - main
      - deploy_staging:
          requires:
            - build_and_push
          filters:
            branches:
              only:
                - main
      - deploy:
          context: Build
          requires:
            - deploy_staging
          filters:
            branches:
              only:
                - main

  # Triggered manually (CircleCI web UI "Trigger Pipeline", or the API) with
  # the deploy_stage parameter set true, on whatever branch you pick - lets
  # any branch deploy to staging without needing it on main or staging first.
  deploy_stage_manual:
    when:
      << pipeline.parameters.deploy_stage >>
    jobs:
      - install_deps
      - test:
          requires:
            - install_deps
      - lint
      - build_and_push:
          context: Build
          requires:
            - test
            - lint
      - deploy_staging:
          requires:
            - build_and_push

  # Not triggered by pushes at all - set up a CircleCI Scheduled Trigger
  # (Project Settings -> Triggers) on whatever cadence you want (e.g.
  # weekly), targeting any branch, with the run_gc parameter set to true.
  # Kept separate from build_and_push since there's no reason a normal
  # deploy should wait on this.
  garbage_collect:
    when:
      << pipeline.parameters.run_gc >>
    jobs:
      - prune_ghcr_untagged:
          context: Build
